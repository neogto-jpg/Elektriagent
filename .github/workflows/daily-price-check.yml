name: Daily EE price check

on:
  schedule:
    # Hourly, 11:23-20:23 UTC (about 14:00-23:00 Tallinn time). GitHub often
    # starts scheduled runs late, sometimes by hours, so several runs are
    # scheduled: the first one after prices are published sends the message,
    # later ones see it was already sent and do nothing.
    - cron: "23 11-20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Delivery day YYYY-MM-DD (empty = tomorrow)"
        required: false
        default: ""
      dry_run:
        description: "Only print the message, do not send"
        type: boolean
        default: false

# Never run two checks at once, so a notification can't be sent twice.
concurrency:
  group: daily-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check prices and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          HIGH_PRICE: ${{ vars.HIGH_PRICE }}
          LOW_PRICE: ${{ vars.LOW_PRICE }}
          SPREAD_PRICE: ${{ vars.SPREAD_PRICE }}
          CHEAP_BLOCK_HOURS: ${{ vars.CHEAP_BLOCK_HOURS }}
          SHOW_HOURLY: ${{ vars.SHOW_HOURLY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--scheduled)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args=(--wait-minutes 0)  # manual runs: answer right away, always send
            [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
            [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
          fi
          python3 price_agent.py "${args[@]}"
