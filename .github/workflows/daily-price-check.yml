name: Daily EE price check

on:
  schedule:
    # GitHub cron is UTC-only. Both run daily; the gate below keeps the one
    # that lands at 15:05 Tallinn time (EEST in summer, EET in winter).
    - cron: "5 12 * * *"
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Delivery day YYYY-MM-DD (empty = tomorrow)"
        required: false
        default: ""
      dry_run:
        description: "Only print the message, do not send"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run only at 15:xx Tallinn time
        id: gate
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$(TZ=Europe/Tallinn date +%z)" = "+0300" ]; then want="5 12 * * *"; else want="5 13 * * *"; fi
          if [ "$SCHEDULE" != "$want" ]; then
            echo "Skipping: this trigger is not 15:05 Tallinn time today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Check prices and notify
        if: steps.gate.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          HIGH_PRICE: ${{ vars.HIGH_PRICE }}
          LOW_PRICE: ${{ vars.LOW_PRICE }}
          SPREAD_PRICE: ${{ vars.SPREAD_PRICE }}
          CHEAP_BLOCK_HOURS: ${{ vars.CHEAP_BLOCK_HOURS }}
          SHOW_HOURLY: ${{ vars.SHOW_HOURLY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--wait-minutes 0)  # manual runs: answer right away
            [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
            [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
          fi
          python3 price_agent.py "${args[@]}"
